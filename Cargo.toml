[workspace]
resolver = "2"
members = [
  "crates/aznora-core",
  "crates/aznora-app",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
